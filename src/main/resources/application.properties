# ===================================================================
# CONFIGURACIÓN DE BASE DE DATOS POSTGRESQL
# ===================================================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/route_optimizer}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

# Dialecto de base de datos
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Hibernate DDL Auto
spring.jpa.hibernate.ddl-auto=update

# Mostrar SQL (desactivado para produccion/alto rendimiento; no satura consola ni disco)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===================================================================
# PROVEEDOR DE MAPAS (100% LIBRE POR DEFECTO: OSRM + OPENSTREETMAP)
# Para volver a Google Maps, cambiar a: viberoute.map.provider=google
# ===================================================================
viberoute.map.provider=osrm
osrm.router.url=https://router.project-osrm.org
nominatim.url=https://nominatim.openstreetmap.org

# Fallback opcional Google Maps si se define API key
google.maps.api.key=${GOOGLE_MAPS_KEY:}

# ===================================================================
# GOOGLE GEMINI (IA)
# ===================================================================

gemini.api.key=${GOOGLE_GEMINI_KEY}
gemini.model=gemini-2.5-flash

# ===================================================================
# LOGGING OPTIMIZADO (Sin basura, solo alertas y eventos reales)
# ===================================================================
# Silenciar ruido de transporte y filtros internos de Spring
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Mantener trazas esenciales del negocio (Colisiones, Desvios, Optimizacion VRP, Seeders)
logging.level.com.routeoptimizer=INFO

# ===================================================================
# JWT SECURITY
# ===================================================================

# Set JWT_SECRET as an environment variable (docker-compose.yml locally, Render dashboard in production)
jwt.secret=${JWT_SECRET}

# FIREBASE STORAGE
firebase.storage.bucket=viberoute-colombia.appspot.com

# PERFORMANCE OPTIMIZATIONS
# Desactivar OSIV para evitar queries extra durante la serialización JSON
spring.jpa.open-in-view=false
